<body>

    <img src="/images/photo.png" alt="">
    <div class="sectionside">
        <div class="mainbox">
        <div class="head">
            <img src="/images/Group 74.svg" alt="">
            <h1 class="header">Create an Account</h1>
        </div>
        <p class="text">Became trivo member ,you’ll get exlusive 
            treatment from trivo</p>
            <form class="form" action="">
                <div class="fullname">
                    <label class="inputfullnamelabel" for="inputfullname">Full Name</label>
                    <input class="inputfullname" type="text" id="inputfullname" placeholder="Enter Your Full name">
                </div>
                <div class="email">
                    <label class="inputemaillabel" for="inputemail">Email<span style="color: red;">*</span></label>
                    <input class="inputemail" type="email" id="inputemail" placeholder="Enter Email">
                </div>
                <div class="password">
                    <label class="inputepasswordlabel" for="inputpassword">Password<span style="color: red;">*</span></label>
                    <input class="inputepassword" type="password" id="inputepassword" placeholder="Create Password">
                </div>
                <button class="button">Create an Account</button>
                <button class="signupgoogle"> <img src="/images/flat-color-icons_google.svg" alt=""> Sign up with Google</button>
                <p class="alreadyhave">Already have an account? <span class="login">log in</span></p>
                

            </form>
        
    </div>
    </div>
